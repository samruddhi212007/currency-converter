<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Currency Converter</title>
  <style>
:root {
  --bg: #eef2f1;
  --card: #ffffff;
  --ink: #14302b;
  --muted: #5d7570;
  --line: #cfdcd9;
  --accent: #0f766e;
  --accent-ink: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e1a18;
    --card: #152623;
    --ink: #e6f2ef;
    --muted: #8fa9a3;
    --line: #2a403c;
    --accent: #2dd4bf;
    --accent-ink: #062521;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 1rem;
  background: var(--bg);
  color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
.converter {
  width: 100%;
  max-width: 460px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 1.75rem;
}
h1 { margin: 0 0 1.5rem; font-size: 1.5rem; }
.row { margin-bottom: 1.25rem; }
.pair { display: flex; align-items: flex-end; gap: .5rem; }
.field { flex: 1; min-width: 0; }
label { display: block; margin-bottom: .35rem; font-size: .9rem; color: var(--muted); }
input, select {
  width: 100%;
  padding: .7rem .75rem;
  font: inherit;
  color: var(--ink);
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 8px;
}
input:focus-visible, select:focus-visible, button:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
#swap {
  flex: none;
  width: 44px;
  height: 44px;
  font-size: 1.2rem;
  color: var(--accent-ink);
  background: var(--accent);
  border: 0;
  border-radius: 50%;
  cursor: pointer;
  transition: transform .25s;
}
#swap:hover { transform: rotate(180deg); }
.result { padding-top: 1rem; border-top: 1px solid var(--line); }
#converted { margin: 0; font-size: 1.75rem; font-weight: 700; overflow-wrap: anywhere; }
#rate { margin: .25rem 0 0; color: var(--muted); font-size: .95rem; }
.status { margin: 1rem 0 0; font-size: .8rem; color: var(--muted); }
.status.error { color: #c2410c; }
@media (prefers-reduced-motion: reduce) { #swap { transition: none; } }
</style>
</head>
<body>
  <main class="converter">
    <h1>Currency Converter</h1>

    <div class="row">
      <div class="field">
        <label for="amount">Amount</label>
        <input id="amount" type="number" min="0" step="any" value="100" inputmode="decimal">
      </div>
    </div>

    <div class="row pair">
      <div class="field">
        <label for="from">From</label>
        <select id="from"></select>
      </div>
      <button id="swap" type="button" aria-label="Swap currencies">⇄</button>
      <div class="field">
        <label for="to">To</label>
        <select id="to"></select>
      </div>
    </div>

    <div class="result" aria-live="polite">
      <p id="converted">—</p>
      <p id="rate"></p>
    </div>

    <p id="status" class="status"></p>
  </main>
  <script>
// Live rates from a free, key-less API. Falls back to approximate rates if offline.
const API_URL = "https://open.er-api.com/v6/latest/USD";

const FALLBACK = {
  USD: 1, EUR: 0.92, GBP: 0.78, INR: 83.5, JPY: 150, AUD: 1.52, CAD: 1.36,
  CHF: 0.88, CNY: 7.2, AED: 3.67, SGD: 1.34, NZD: 1.65, ZAR: 18.5, BRL: 5.0, MXN: 17.0
};

const amountEl = document.getElementById("amount");
const fromEl = document.getElementById("from");
const toEl = document.getElementById("to");
const swapBtn = document.getElementById("swap");
const convertedEl = document.getElementById("converted");
const rateEl = document.getElementById("rate");
const statusEl = document.getElementById("status");

let rates = FALLBACK; // all rates are relative to USD

function fillSelects() {
  const names = typeof Intl.DisplayNames === "function"
    ? new Intl.DisplayNames(["en"], { type: "currency" }) : null;
  const codes = Object.keys(rates).sort();
  const options = codes.map(c => {
    let name = "";
    try { name = names ? names.of(c) : ""; } catch (e) {}
    return `<option value="${c}">${c}${name ? " – " + name : ""}</option>`;
  }).join("");
  const prevFrom = fromEl.value || "USD";
  const prevTo = toEl.value || "INR";
  fromEl.innerHTML = options;
  toEl.innerHTML = options;
  fromEl.value = rates[prevFrom] ? prevFrom : "USD";
  toEl.value = rates[prevTo] ? prevTo : "EUR";
}

function format(value, code) {
  try {
    return new Intl.NumberFormat(undefined, { style: "currency", currency: code, maximumFractionDigits: 2 }).format(value);
  } catch (e) {
    return value.toFixed(2) + " " + code;
  }
}

function convert() {
  const amount = parseFloat(amountEl.value);
  const from = fromEl.value, to = toEl.value;
  if (isNaN(amount) || amount < 0) {
    convertedEl.textContent = "—";
    rateEl.textContent = "Enter a valid amount.";
    return;
  }
  const rate = rates[to] / rates[from];
  convertedEl.textContent = format(amount * rate, to);
  rateEl.textContent = `1 ${from} = ${rate.toFixed(4)} ${to}`;
}

async function loadRates() {
  statusEl.className = "status";
  statusEl.textContent = "Loading latest rates…";
  try {
    const res = await fetch(API_URL);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    if (data.result !== "success") throw new Error("API error");
    rates = data.rates;
    statusEl.textContent = "Rates updated: " + new Date(data.time_last_update_utc).toLocaleString();
  } catch (err) {
    rates = FALLBACK;
    statusEl.className = "status error";
    statusEl.textContent = "Couldn't load live rates. Showing approximate offline rates.";
  }
  fillSelects();
  convert();
}

amountEl.addEventListener("input", convert);
fromEl.addEventListener("change", convert);
toEl.addEventListener("change", convert);
swapBtn.addEventListener("click", () => {
  [fromEl.value, toEl.value] = [toEl.value, fromEl.value];
  convert();
});

fillSelects();
fromEl.value = "USD";
toEl.value = "INR";
convert();
loadRates();
</script>
</body>
</html>
